<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Goody V2 — In Progress</title>
<meta name="description" content="Goody V2 — under construction." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%230e0e0e' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23DC2626'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --paper: #f5f2eb;
  --ink: #0e0e0e;
  --ink-mute: #6f6a60;
  --red: #dc2626;
  --en: "Inter", -apple-system, sans-serif;
  --jp-serif: "Noto Serif JP", "Times New Roman", serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--en);
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.grain {
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.45'/></svg>");
  opacity: 0.07;
  pointer-events: none;
  mix-blend-mode: multiply;
  z-index: 1;
}
.tag {
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 28px;
  z-index: 2;
}
h1 {
  font-family: var(--jp-serif);
  font-weight: 700;
  font-size: clamp(40px, 8vw, 96px);
  line-height: 1.05;
  letter-spacing: -0.01em;
  margin-bottom: 18px;
  z-index: 2;
}
h1 .accent { color: var(--red); }
.sub {
  font-family: var(--jp-serif);
  font-weight: 500;
  font-size: clamp(14px, 1.6vw, 18px);
  letter-spacing: 0.32em;
  color: var(--ink-mute);
  margin-bottom: 48px;
  z-index: 2;
}
.back {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--ink);
  text-decoration: none;
  border: 1px solid var(--ink);
  padding: 12px 26px 11px;
  border-radius: 999px;
  transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease;
  z-index: 2;
}
.back:hover { background: var(--ink); color: var(--paper); transform: translateY(-1px); }
.back .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
.corner {
  position: fixed;
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ink-mute);
  z-index: 4;
}
.corner.tl { top: 40px; left: 40px; }
.corner.br { bottom: 40px; right: 40px; }
</style>
</head>
<body>
<div class="grain"></div>
<div class="corner tl">Goody Inc. · V2</div>
<div class="corner br">In Progress</div>

<div class="tag">V2 · Work in progress</div>
<h1>つくる<span class="accent">、</span>その先へ。</h1>
<p class="sub">A new version is being designed. Check back soon.</p>
<a class="back" href="index.html"><span class="dot" aria-hidden="true"></span>Back to entry</a>
</body>
</html>
